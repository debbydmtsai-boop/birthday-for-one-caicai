  <style>:root{font-family:'PingFang TC','Noto Sans TC',system-ui,sans-serif;color:#59483e;background:#fbf6ed;--accent:#b78365;--tint:#f8e9da;--deep:#755341;--gold:#c49a54;--cream:#fffaf1}

.intro{padding:30px 4px 16px}.ornament{font-family:'Noto Serif TC',serif;color:#c8a16b;font-size:1.5rem;letter-spacing:.65em;margin-bottom:22px}.panel{border:1px solid #eadcc6;background:rgba(255,252,246,.89);border-radius:26px;padding:24px;box-shadow:0 15px 55px rgba(107,75,44,.07)}.panel+.panel{margin-top:15px}.field{display:block;margin:18px 0}.field>span,.field legend{display:block;font-size:.94rem;font-weight:700;color:#624d42;margin-bottom:9px}.field input,.field textarea{width:100%;border:1px solid #decbb2;border-radius:15px;padding:13px 15px;min-height:50px;background:#fffdf9;color:#4f4039;outline:none}.field textarea{min-height:118px;resize:vertical;line-height:1.7}.field input:focus,.field textarea:focus{border-color:var(--accent)}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{color:#89776b;font-size:.85rem;line-height:1.55;margin:8px 0 0}.error{color:#a54441;min-height:1.4em;font-size:.9rem;margin:10px 0}

.hero-note{background:linear-gradient(145deg,#fff9ed,#f7e8d2);border:1px solid #e7d3ae;border-radius:24px;padding:23px;margin:20px 0}.hero-note p{line-height:1.85;margin:0;color:#725d4d}.scene-frame{width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:26px;background:#efe1cd;position:relative;box-shadow:0 20px 45px rgba(84,55,33,.14)}.scene-frame video,.scene-frame .scene-photo{width:100%;height:100%;object-fit:cover;display:block}.scene-frame video{background:#392d28}.film-caption{position:absolute;left:0;right:0;bottom:0;padding:52px 18px 30px;text-align:center;background:linear-gradient(transparent,rgba(39,30,27,.7));color:white;opacity:0;transition:opacity 1.3s;pointer-events:none}.film-caption.show{opacity:1}.film-caption strong{font-family:'Noto Serif TC',serif;display:block;font-size:1.43rem;line-height:1.65}.film-caption span{display:block;line-height:1.8;margin-top:8px}.video-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(38,28,20,.32);color:#fff;text-align:center;padding:24px}.video-overlay button{background:#fff7e8;border:none;border-radius:100px;color:#6f533e;padding:15px 22px;font-weight:700}.video-tools{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:12px 2px 0;font-size:.86rem;color:#78685e}.text-button{background:none;border:0;text-decoration:underline;text-underline-offset:3px;color:#806b59;min-height:42px;padding:8px}
.map-head{padding:28px 1px 10px}.chapter-list{display:grid;gap:12px;margin:18px 0}.chapter-card{display:flex;align-items:center;gap:15px;border:1px solid #e5d2b7;border-radius:21px;padding:18px;background:#fffaf1;text-align:left;width:100%;color:#604d43;box-shadow:0 7px 20px rgba(113,79,42,.05)}.chapter-card .icon{font-size:1.85rem;width:39px;text-align:center}.chapter-card .card-main{flex:1}.chapter-card strong{font-family:'Noto Serif TC',serif;font-size:1.07rem;display:block}.chapter-card small{color:#8a7669;font-size:.89rem;display:block;margin-top:5px}.progress-track{height:5px;background:#eedfd0;border-radius:100px;margin-top:10px;overflow:hidden}.progress-track i{height:100%;background:var(--accent);display:block;border-radius:100px;transition:width .3s}.note{font-size:.91rem;color:#816c5d;line-height:1.8;padding:15px 18px;background:#f9efdf;border-radius:16px}.step-meta{display:flex;justify-content:space-between;color:#987c61;font-size:.88rem;margin:28px 0 12px}.moment-title{font-family:'Noto Serif TC',serif;font-size:1.58rem;color:#604b3e;margin:0 0 10px}.prompt{font-size:1.03rem;line-height:1.85;margin:0 0 18px}.choices{display:grid;gap:10px}.choice{border:1.5px solid #e3d3c0;background:#fffdf8;border-radius:15px;padding:14px 16px;text-align:left;color:#5c4e44;min-height:54px}.choice[aria-pressed=true]{border-color:var(--accent);background:var(--tint);font-weight:700}.small-link{font-size:.88rem;color:#887362;text-align:center;margin-top:10px}
.cake-stage{position:relative}.cake-stage .scene-photo{filter:brightness(1);transition:filter 1.35s}.cake-stage.dim .scene-photo{filter:brightness(.43)}.cake-stage.bright .scene-photo{filter:brightness(.92)}.cake-stage.dim:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 49%,rgba(255,211,114,.11),rgba(13,12,22,.43) 80%);pointer-events:none;opacity:1;transition:opacity 1.4s}.cake-stage.bright:after{opacity:0}.candles{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;gap:0;z-index:2;filter:drop-shadow(0 2px 4px rgba(88,38,15,.28))}.candles img{width:clamp(49px,17vw,90px);height:auto;object-fit:contain;margin:0 -4px}.cake-stage.dim .candles{filter:drop-shadow(0 0 13px rgba(255,186,58,.75))}.cake-message{position:absolute;left:8%;right:8%;bottom:5%;z-index:3;text-align:center;color:#fff7df;text-shadow:0 2px 12px rgba(33,19,15,.9);font-size:1.06rem;line-height:1.7}.wish-copy{text-align:center;padding:17px 0 0}.wish-copy h2{font-family:'Noto Serif TC',serif;font-size:1.45rem;margin:0 0 10px;color:#725338}.wish-copy p{line-height:1.8;margin:0;color:#7b6556}.hold-wrap{position:relative;width:185px;height:185px;margin:24px auto 0;display:grid;place-items:center}.hold-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#d8ae5e var(--hold,0%),rgba(218,187,120,.24) 0);padding:7px;box-shadow:0 0 28px rgba(220,177,86,.2);animation:breathe 3s ease-in-out infinite}.hold-ring:after{content:'';display:block;width:100%;height:100%;border-radius:50%;background:#fff9eb}.hold-button{position:relative;width:147px;height:147px;border:none;border-radius:50%;background:linear-gradient(145deg,#fff9e9,#f6e3bd);color:#8a6738;font-family:'Noto Serif TC',serif;font-size:1.18rem;font-weight:700;touch-action:none;user-select:none;box-shadow:0 3px 14px rgba(91,61,31,.1)}.hold-wrap.done .hold-ring{animation:halo .9s ease-out forwards}.spark{position:absolute;left:50%;top:45%;color:#f9cc6d;pointer-events:none;animation:rise 1s ease-out forwards}.hold-hint{text-align:center;color:#8d7655;font-size:.9rem;margin:6px 0 19px}@keyframes breathe{50%{box-shadow:0 0 42px rgba(229,179,73,.52)}}@keyframes halo{100%{box-shadow:0 0 85px 28px rgba(247,205,117,0)}}@keyframes rise{to{opacity:0;transform:translateY(-95px)}}
.mic-status{text-align:center;color:#826d5b;min-height:1.5em;font-size:.91rem;margin:12px 0}.blow-panel{padding-top:17px}.blow-actions{display:grid;gap:10px}#manual{background:linear-gradient(90deg,#eed4a1 var(--hold,0%),#fffaf2 var(--hold,0%))}.memory{background:#fffaf0;border:1px solid #ddc395;border-radius:25px;padding:25px 23px;box-shadow:0 16px 42px rgba(122,82,34,.12)}.memory .monogram{border:1px dashed #d7bb8c;border-radius:20px;background:#f5e7d1;min-height:160px;display:grid;place-items:center;color:#9b7654;font-family:'Noto Serif TC',serif;font-size:3.7rem;overflow:hidden;margin-bottom:21px}.memory .monogram img{width:100%;height:210px;object-fit:cover}.memory h2{font-family:'Noto Serif TC',serif;color:#6b4b39;font-size:1.48rem;line-height:1.5;margin:0 0 8px}.memory .mem-meta{color:#937558;line-height:1.7;margin:0 0 17px}.memory blockquote{margin:15px 0;padding:13px 17px;border-left:3px solid #c69a59;background:#fff4df;border-radius:0 10px 10px 0;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.memory .ending{font-family:'Noto Serif TC',serif;text-align:center;line-height:2;margin-top:22px;color:#75553c}.photo-options{display:grid;gap:9px;margin-top:16px}.photo-options label{display:block;text-align:center}.file-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.footer{margin:28px 0 0;color:#9a8877;font-size:.82rem;line-height:1.7;text-align:center}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#554435;color:white;border-radius:100px;padding:12px 19px;z-index:20;font-size:.87rem;box-shadow:0 8px 30px #0002;max-width:90vw;text-align:center}.hidden{display:none!important}
@media(min-width:700px){.app-shell{padding:30px 28px 45px;border-left:1px solid #eadcc8;border-right:1px solid #eadcc8;background:rgba(255,251,244,.5)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="app" class="app-shell"><main class="page"><div class="intro"><h1 class="title">在生日開始以前……</h1><p class="sub">正在準備你的生日。</p></div></main></div>
  <audio id="music" src="birthday-music.mp3" preload="none" loop></audio>
  <script src="candles-lit.js"></script>
<script src="candles-blowing.js"></script>
<script src="candles-smoke.js"></script>
<script src="candles-just.js"></script>
<script src="candles-unlit.js"></script>
<script>const chapters = [
  {
    id: 'morning', icon: '☀️', title: '早晨｜今天的我', time: '早晨',
    lead: '新的一歲，先和現在的自己打個招呼。',
    welcome: '上午的你已經留下了一些東西，現在來看看午後的自己。',
    moments: [
      { id: 'm1', title: '此刻的心情', prompt: '今天醒來，你的心情比較靠近哪一種？', kind: 'choice', options: ['輕輕期待', '有點平靜', '說不上來', '想慢慢來'] },
      { id: 'm2', title: '對自己說一句話', prompt: '如果可以對今天的自己說一句話，你想說什麼？', kind: 'text', placeholder: '例如：辛苦了，今天慢慢過。' },
      { id: 'm3', title: '留一點期待', prompt: '今天想留給自己哪一種小小的期待？', kind: 'choice', options: ['吃一樣喜歡的東西', '聽一首歌', '安靜休息', '讓今天自然發生'] }
    ]
  },
  {
    id: 'afternoon', icon: '🌤️', title: '午後｜好好對待自己', time: '午後',
    lead: '把這個午後，還給自己的節奏。',
    welcome: '歡迎回來。🌤️ 下午的小片刻，正等著你。',
    moments: [
      { id: 'a1', title: '一點好好對待', prompt: '現在，想用什麼方式對自己好一點？', kind: 'choice', options: ['喝杯喜歡的飲料', '到外面走走', '放下手機休息', '照自己的步調過'] },
      { id: 'a2', title: '停一下', prompt: '慢慢吸氣，再緩緩吐氣。這一刻，想把什麼留給自己？', kind: 'text', placeholder: '一個詞、一句話，或留白都可以。' },
      { id: 'a3', title: '看見自己', prompt: '最近的自己，有哪件小事值得被看見？', kind: 'text', placeholder: '再小的事情，也可以寫在這裡。' }
    ]
  },
  {
    id: 'night', icon: '🌙', title: '夜晚｜留給自己的話', time: '夜晚',
    lead: '不急著總結，先好好收下今天。',
    welcome: '歡迎回來。🌙 今晚，留一點時間給自己。',
    moments: [
      { id: 'n1', title: '今天的一點光', prompt: '今天有哪個小片刻，想留下來記得？', kind: 'text', placeholder: '可以是很平凡的一瞬間。' },
      { id: 'n2', title: '輕輕放下', prompt: '有什麼事情，今晚想先暫時放下？', kind: 'choice', options: ['對自己的苛求', '還沒做完的事', '別人的期待', '現在先不決定'] },
      { id: 'n3', title: '給新的一歲', prompt: '送給新的一歲一句話吧。', kind: 'text', placeholder: '這句話會留在你的生日紀念裡。' }
    ]
  }
];

const theme = {
  girl: { label: '女生版', accent: '#ba7f80', tint: '#f7e5e1', deep: '#794f58', video: 'morning-girl.mp4' },
  boy: { label: '男生版', accent: '#658c83', tint: '#e2eee8', deep: '#3d6661', video: 'morning-boy.mp4' }
};

const signs = [
  ['摩羯座','♑',1,19], ['水瓶座','♒',2,18], ['雙魚座','♓',3,20],
  ['牡羊座','♈',4,19], ['金牛座','♉',5,20], ['雙子座','♊',6,21],
  ['巨蟹座','♋',7,22], ['獅子座','♌',8,22], ['處女座','♍',9,22],
  ['天秤座','♎',10,23], ['天蠍座','♏',11,22], ['射手座','♐',12,21],
  ['摩羯座','♑',12,31]
];

function zodiac(month, day) {
  const n = month * 100 + day;
  const cutoffs = [119,218,320,419,520,621,722,822,922,1023,1122,1221,1231];
  const index = cutoffs.findIndex((value) => n <= value);
  return { name: signs[index][0], symbol: signs[index][1] };
}

const candleStages = {
  lit: '01_lit', blowing: '02_blowing', smoke: '03_smoke', just: '04_just_extinguished', unlit: '05_unlit'
};
function candlePath(stage, digit) {
  return window.BIRTHDAY_CANDLES[stage][digit];
}


const KEY = 'caicai-birthday-v1';
const empty = () => ({ version: 1, profile: null, answers: {}, progress: { morning: 0, afternoon: 0, night: 0, total: 0 }, morningSeen: false, deliverySeen: false, wished: false, blown: false, completedAt: null });
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (!saved || saved.version !== 1 || !saved.profile) return empty();
    return { ...empty(), ...saved, answers: saved.answers || {} };
  } catch { return empty(); }
}
function save(state) {
  state.progress = Object.fromEntries(chapters.map(ch => [ch.id, count(state, ch)]));
  state.progress.total = Object.values(state.progress).reduce((sum, n) => sum + n, 0);
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch { return false; }
}
function makeProfile({ name, version, month, day, age }) {
  const m = Number(month), d = Number(day), a = Number(age);
  const date = new Date(2024, m - 1, d);
  const nameLength = Array.from(name.trim()).reduce((length, char) => length + (/[^\u0000-\u007f]/.test(char) ? 2 : 1), 0);
  if (!name.trim() || nameLength > 12) throw new Error('請輸入稱呼，最多約 6 個中文字。');
  if (!['girl', 'boy'].includes(version)) throw new Error('請選擇女生版或男生版。');
  if (!Number.isInteger(m) || !Number.isInteger(d) || date.getMonth() !== m - 1 || date.getDate() !== d) throw new Error('請填寫有效的生日月與日。');
  if (!Number.isInteger(a) || a < 1 || a > 99) throw new Error('年齡請填入 1～99。');
  return { name: name.trim(), version, month: m, day: d, age: a, zodiac: zodiac(m, d) };
}
const hasOwn = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
const count = (state, chapter) => chapter.moments.filter(m => hasOwn(state.answers, m.id)).length;
const allAnswered = state => chapters.every(ch => count(state, ch) === 3);
const completed = state => state.wished && state.blown && allAnswered(state);
function saveAnswer(state, id, value) {
  state.answers[id] = value;
  save(state);
}


const app = document.querySelector('#app');
const music = document.querySelector('#music');
let state = load();
let route = state.profile ? (completed(state) ? 'memory' : state.wished ? 'blow' : state.morningSeen ? 'map' : 'morning-film') : 'setup';
let selectedVersion = state.profile?.version || '';
let chapterIndex = 0, momentIndex = 0, justFinishedIndex = 0, photoMode = 'none', photoUrl = null;
let micStream = null, audioContext = null, raf = 0, blowStarted = false, musicWanted = false;
let resumeNotice = Boolean(state.profile && route === 'map');
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const top = () => `<header class="topbar"><span class="wordmark">一個人也可以好好過生日</span><button class="sound" id="sound" aria-label="${musicWanted ? '關閉' : '開啟'}背景音樂">${musicWanted ? '♫ 音樂開' : '♫ 音樂關'}</button></header>`;
const footer = () => `<p class="footer">這段旅程留在這台裝置的瀏覽器裡。<br>願望只留在你的心裡。</p>`;
function paint(html) {
  app.innerHTML = top() + html;
  document.querySelector('#sound').onclick = toggleMusic;
  try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (_) { window.scrollTo(0, 0); }
}
function go(next) { stopMic(); route = next; render(); }
function toast(message) { document.querySelector('.toast')?.remove(); const el = document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=message; document.body.append(el); setTimeout(()=>el.remove(),3200); }
function applyTheme(version) { const v = theme[version]; document.documentElement.style.setProperty('--accent',v?.accent||'#b78365'); document.documentElement.style.setProperty('--tint',v?.tint||'#f8e9da'); document.documentElement.style.setProperty('--deep',v?.deep||'#755341'); }
function toggleMusic() { musicWanted = !musicWanted; if(musicWanted) { music.volume=.35; music.play().catch(()=>toast('輕觸畫面後，可再開啟音樂。')); } else music.pause(); document.querySelector('#sound').textContent=musicWanted?'♫ 音樂開':'♫ 音樂關'; }
function pauseMusicForFilm() { music.pause(); }
function resumeMusic() { if(musicWanted) music.play().catch(()=>{}); }
function setup() {
  paint(`<main class="page"><div class="intro"><div class="ornament">✦ ✧ ✦</div><p class="eyebrow">在生日開始以前……</p><h1 class="title">先讓今天，<br>多認識你一點。</h1><p class="sub">這一天，可以照你的步調來。</p></div>
  <form id="setup-form" class="panel" novalidate>
  <label class="field"><span>今天想被怎麼稱呼？</span><input name="name" autocomplete="nickname" maxlength="12" placeholder="名字或暱稱" required></label>
  <div class="field"><span>選擇一個畫面版本</span><div class="version-pick">${Object.entries(theme).map(([key,v])=>`<button type="button" class="version" data-version="${key}" aria-pressed="false"><strong>${v.label}</strong><small>${key==='girl'?'柔粉・粉杏':'霧綠・灰藍綠'}</small></button>`).join('')}</div><p class="hint">決定早晨影片與介面色調，許願的暖金儀式相同。</p></div>

}
function film(type) {
  const isMorning = type==='morning';
  const source=isMorning ? theme[state.profile.version].video : 'cake-delivery.mp4';
  const label=isMorning?'清晨，慢慢醒來':'有人記得這一天';
  paint(`<main class="page"><div class="intro"><p class="eyebrow">${isMorning?'☀️ 早晨':'🎂 生日的祝福'}</p><h1 class="title">${label}</h1><p class="sub">${isMorning?'窗簾拉開，今天也從這裡開始。':'蔡蔡把蛋糕送來，接下來的時間留給你。'}</p></div><div class="scene-frame"><video id="film" src="${source}" playsinline webkit-playsinline preload="metadata" ${isMorning?'':'poster="cake-scene.jpg"'}></video><div id="film-caption" class="film-caption"><strong>${isMorning?'今天，是你的生日。':'祝你生日快樂。'}</strong><span>${isMorning?'新的一歲，從這個早晨開始。':'這個生日，完整地屬於你。'}</span></div><div id="film-overlay" class="video-overlay hidden"><button id="play-film" type="button">▶ 播放影片</button></div></div><div class="video-tools"><span>影片可以依你的節奏觀看</span><button class="text-button" id="skip-film">跳過影片</button></div><div class="actions"><button class="primary full hidden" id="film-next">${isMorning?'走進今天':'準備許願'}</button></div></main>`);
  const video=document.querySelector('#film'), caption=document.querySelector('#film-caption'), next=document.querySelector('#film-next'), overlay=document.querySelector('#film-overlay');
  const finish=()=>{ caption.classList.add('show'); next.classList.remove('hidden'); if(isMorning) state.morningSeen=true; else state.deliverySeen=true; save(state); resumeMusic(); };
  pauseMusicForFilm(); video.addEventListener('ended',finish,{once:true});
  video.addEventListener('timeupdate',()=>{if(isMorning && video.duration && video.duration-video.currentTime<3.6) caption.classList.add('show');});
  const tryPlay=()=>video.play().then(()=>overlay.classList.add('hidden')).catch(()=>overlay.classList.remove('hidden'));
  document.querySelector('#play-film').onclick=tryPlay;
  document.querySelector('#skip-film').onclick=()=>{video.pause();finish();};
  next.onclick=()=>go(isMorning?'map':'wish');
  tryPlay();
}
function daytimeGreeting(){let hour=new Date().getHours();return hour<12?'早安':hour<18?'午安':'晚安';}
function map() {
  const p=state.profile, total=chapters.reduce((n,ch)=>n+count(state,ch),0);
  let welcome=resumeNotice?`歡迎回來。${daytimeGreeting()==='早安'?'☀️':daytimeGreeting()==='午安'?'🌤️':'🌙'}<br>你的生日旅程，還在這裡等你。`:`${esc(p.name)}，今天可以慢慢走。`;
  if(resumeNotice && count(state,chapters[0])===3 && count(state,chapters[1])<3) welcome=`歡迎回來。🌤️<br>${chapters[0].welcome}`;
  resumeNotice=false;
  paint(`<main class="page"><div class="map-head"><p class="eyebrow">${daytimeGreeting()}，${esc(p.name)}</p><h1 class="title">這一天，<br>由你慢慢走過。</h1><p class="sub">${welcome}</p></div><div class="hero-note"><p>你的生日是 ${p.month} 月 ${p.day} 日。你的星座是 ${p.zodiac.name} ${p.zodiac.symbol}。<br>每個小片刻，都可以照自己的速度來。</p></div><p class="eyebrow">生日的小片刻 · ${total}/9</p><div class="chapter-list">${chapters.map((ch,i)=>`<button class="chapter-card" data-chapter="${i}"><span class="icon">${ch.icon}</span><span class="card-main"><strong>${ch.title}</strong><small>${count(state,ch)}/3 ${count(state,ch)===3?'✓':''}</small><span class="progress-track"><i style="width:${count(state,ch)*100/3}%"></i></span></span></button>`).join('')}</div><p class="note">現在的時間只會改變問候，不會鎖住任何章節。</p>${allAnswered(state)?`<div class="actions"><button class="primary full" id="cake-entry">${state.blown?'看看我的生日紀念':state.deliverySeen?'回到我的生日蛋糕':'收下送來的蛋糕'}</button></div>`:''}${footer()}</main>`);
  document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>openChapter(Number(b.dataset.chapter)));
  document.querySelector('#cake-entry')?.addEventListener('click',()=>go(state.blown?'memory':state.deliverySeen?'wish':'delivery-film'));
}
function openChapter(index) {

}
function timeChoice(){const ch=chapters[chapterIndex];paint(`<main class="page"><div class="intro"><p class="eyebrow">${ch.icon} ${ch.time}</p><h1 class="title">${ch.title}</h1><p class="sub">${chapterIndex===1?'現在還是早上。':'現在還沒到夜晚。'}<br>如果你想晚一點再回來，我們會把這裡留給你。</p></div><div class="actions"><button class="primary full" id="continue-now">現在就繼續</button><button class="secondary full" id="later">晚點再回來</button></div></main>`);document.querySelector('#continue-now').onclick=()=>go('moment');document.querySelector('#later').onclick=()=>go('map');}
function moment() {

  paint(`<main class="page"><div class="intro"><p class="eyebrow">${ch.icon} ${ch.title}</p><h1 class="title">${ch.lead}</h1></div><div class="panel"><div class="step-meta"><span>小片刻 ${momentIndex+1} / 3</span><span>${count(state,ch)} / 3 已留下</span></div><h2 class="moment-title">${m.title}</h2><p class="prompt">${m.prompt}</p>${m.kind==='choice'?`<div class="choices">${m.options.map(option=>`<button type="button" class="choice" data-choice="${esc(option)}" aria-pressed="${saved===option}">${esc(option)}</button>`).join('')}</div>`:`<label class="field"><span class="hidden">你的回答</span><textarea id="answer" maxlength="120" placeholder="${esc(m.placeholder)}">${esc(saved)}</textarea></label>`}<div class="actions"><button id="save-moment" class="primary full">${momentIndex===2?'留下這個小片刻':'繼續下一個小片刻'}</button><button id="leave-blank" class="quiet full">${hasOwn(state.answers,m.id)?'清空，先留白':'先留白，繼續走'}</button></div></div><button class="quiet full" id="back-map">回到生日的一天</button></main>`);

  document.querySelector('#save-moment').onclick=()=>{const value=m.kind==='choice'?choice:document.querySelector('#answer').value.trim();if(!value){toast('可以填寫，或選「先留白」繼續。');return;}finish(value);};
  document.querySelector('#leave-blank').onclick=()=>finish('');
  document.querySelector('#back-map').onclick=()=>go('map');
}
function chapterDone(){const ch=chapters[justFinishedIndex];const final=allAnswered(state);paint(`<main class="page"><div class="intro"><p class="eyebrow">${ch.icon} ${ch.time}的小片刻</p><h1 class="title">你把這段時間，<br>好好留給自己了。</h1><p class="sub">${final?'生日的三個章節，都在這裡了。':'想繼續走，或晚一點再回來，都很好。'}</p></div><div class="hero-note"><p>${ch.title} · 3/3 ✓</p></div><div class="actions"><button class="primary full" id="next-chapter">${final?'收下送來的蛋糕':`走進${chapters[chapterIndex].time}`}</button><button class="secondary full" id="back-map">回到生日的一天</button></div></main>`);document.querySelector('#next-chapter').onclick=()=>final?go(state.deliverySeen?'wish':'delivery-film'):openChapter(chapterIndex);document.querySelector('#back-map').onclick=()=>go('map');}
function cakeScene(stage='lit',className='dim',message='') {return `<div class="scene-frame cake-stage ${className}"><img class="scene-photo" src="cake-scene.jpg" alt="溫暖房間裡，水果生日蛋糕留在桌上"><div class="candles" id="candles">${String(state.profile.age).split('').map(d=>`<img src="${candlePath(stage,d)}" alt="數字 ${d} 蠟燭">`).join('')}</div>${message?`<div class="cake-message">${message}</div>`:''}</div>`;}
function setCandleStage(stage){document.querySelectorAll('#candles img').forEach((img,i)=>{img.src=candlePath(stage,String(state.profile.age)[i]);});}
function wish() {
  if(state.wished) return go('blow');
  paint(`<main class="page"><div class="intro"><p class="eyebrow">✦ 屬於你的許願時間</p><h1 class="title">先把燈光，<br>慢慢調低。</h1></div>${cakeScene('lit','bright')}<div class="wish-copy"><h2>現在是屬於你的許願時間。</h2><p>閉上眼睛，在心裡許個願。<br>不用說出來，也不用寫下來。<br>準備好了，再輕輕按下。</p></div><div class="hold-wrap" id="wish-hold"><div class="hold-ring"></div><button class="hold-button" id="wish-button" type="button">✨ 我許好了 ✨</button></div><p class="hold-hint">長按直到光圈完成 ✨</p></main>`);
  requestAnimationFrame(()=>document.querySelector('.cake-stage')?.classList.replace('bright','dim'));
  attachHold('#wish-button','#wish-hold',1350,()=>{navigator.vibrate?.(30);const ring=document.querySelector('#wish-hold');ring.classList.add('done');ring.insertAdjacentHTML('beforeend','<span class="spark">✦</span>');document.querySelector('#wish-button').style.opacity='0';state.wished=true;save(state);setTimeout(()=>go('blow'),850);});
}
function attachHold(buttonSel,wrapSel,duration,onDone){const button=document.querySelector(buttonSel),wrap=document.querySelector(wrapSel);let start=0,frame=0,active=false,done=false;function clear(){active=false;cancelAnimationFrame(frame);if(!done)wrap.style.setProperty('--hold','0%');}function tick(){if(!active)return;let part=Math.min(1,(performance.now()-start)/duration);wrap.style.setProperty('--hold',`${part*100}%`);if(part>=1){done=true;clear();onDone();}else frame=requestAnimationFrame(tick);}function begin(e){if(done||active)return;e.preventDefault();active=true;start=performance.now();if(e.pointerId!==undefined)button.setPointerCapture?.(e.pointerId);tick();}button.addEventListener('pointerdown',begin);button.addEventListener('pointerup',clear);button.addEventListener('pointercancel',clear);button.addEventListener('lostpointercapture',clear);button.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')begin(e);});button.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')clear();});window.addEventListener('blur',clear,{once:true});}
function blow(){paint(`<main class="page"><div class="intro"><p class="eyebrow">🕯️ 吹熄蠟燭</p><h1 class="title">願望收好了。</h1><p class="sub">現在，把蠟燭吹熄吧。</p></div>${cakeScene('lit','dim')}<div class="blow-panel"><p class="mic-status" id="mic-status" role="status">可以對著麥克風吹氣，也可以長按吹熄。</p><div class="blow-actions"><button id="mic" class="primary full">使用麥克風吹氣</button><button id="manual" class="secondary full">長按這裡吹熄蠟燭</button></div><p class="hint">麥克風只在此刻於裝置上判斷聲音強弱，不錄音、不上傳。</p></div></main>`);document.querySelector('#mic').onclick=startMic;attachHold('#manual','#manual',1050,extinguish);}
async function startMic(){if(blowStarted||micStream)return;const status=document.querySelector('#mic-status');try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('unsupported');micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false},video:false});audioContext=new (window.AudioContext||window.webkitAudioContext)();const source=audioContext.createMediaStreamSource(micStream),analyser=audioContext.createAnalyser();analyser.fftSize=1024;source.connect(analyser);let data=new Uint8Array(analyser.fftSize),above=0;status.textContent='對著手機輕輕吹氣；如果沒有反應，也可以長按。';const check=()=>{if(!micStream||blowStarted)return;analyser.getByteTimeDomainData(data);let sum=0;for(const x of data)sum+=((x-128)/128)**2;const rms=Math.sqrt(sum/data.length);if(rms>.09)above+=1;else above=Math.max(0,above-2);if(above>8){extinguish();return;}raf=requestAnimationFrame(check);};check();}catch{status.textContent='這次無法使用麥克風，長按也能完成生日。';stopMic();}}

function extinguish(){if(blowStarted)return;blowStarted=true;stopMic();document.querySelector('#mic')?.setAttribute('disabled','');document.querySelector('#manual')?.setAttribute('disabled','');const status=document.querySelector('#mic-status');if(status)status.textContent='呼——';setCandleStage('blowing');setTimeout(()=>{setCandleStage('just');if(status)status.textContent='蠟燭熄滅了。';},350);setTimeout(()=>setCandleStage('smoke'),740);setTimeout(()=>{setCandleStage('unlit');document.querySelector('.cake-stage')?.classList.replace('dim','bright');},1450);setTimeout(()=>{state.blown=true;state.completedAt=new Date().toISOString();save(state);go('memory');},2850);}
function memory(){const p=state.profile;const chosen=[state.answers.m2,state.answers.a3,state.answers.n3].filter(Boolean);paint(`<main class="page"><div class="intro"><p class="eyebrow">✦ 生日紀念</p><h1 class="title">新的一歲，<br>從這裡開始。</h1><p class="sub">謝謝今天的你，陪自己走過這一天。</p></div><div id="memory-card" class="memory"><div class="monogram" id="portrait" aria-label="紀念卡照片位置">${photoMode==='upload'&&photoUrl?`<img src="${photoUrl}" alt="你選擇的照片">`:photoMode==='default'?'<span style="font-size:1rem;text-align:center;padding:20px;line-height:1.7">預設人物素材位置<br>等待正式人物圖</span>':`<span aria-hidden="true">✦</span>`}</div><p class="eyebrow">MY BIRTHDAY MEMORY</p><h2>${esc(p.name)}，生日快樂。</h2><p class="mem-meta">${p.month} 月 ${p.day} 日 · ${p.age} 歲 · ${p.zodiac.name} ${p.zodiac.symbol}<br>${state.completedAt?new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric'}).format(new Date(state.completedAt)):''}</p>${chosen.length?chosen.map(x=>`<blockquote>${esc(x)}</blockquote>`).join(''):'<blockquote>今天，也有屬於自己的小片刻。</blockquote>'}<p class="ending">今年，我也為自己許了一個願。<br>原來一個人，也可以好好過生日。</p></div><div class="panel" style="margin-top:17px"><strong>要不要留下一張今天的自己？</strong><div class="photo-options"><label class="secondary" for="photo-upload">上傳照片<input class="file-input" id="photo-upload" type="file" accept="image/*"></label><button class="secondary" id="default-photo">使用預設人物</button><button class="secondary" id="no-photo">不放照片</button></div><p class="hint">照片只在目前頁面預覽，不上傳，也不寫入生日進度。</p></div><div class="actions"><button class="primary full" id="download-card">下載我的生日紀念卡</button><button class="quiet full" id="back-map">回到生日的一天</button></div>${footer()}</main>`);document.querySelector('#photo-upload').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('請選擇圖片檔。');if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(file);photoMode='upload';memory();};document.querySelector('#default-photo').onclick=()=>{photoMode='default';memory();toast('正式預設人物素材尚待放入，先保留位置。');};document.querySelector('#no-photo').onclick=()=>{photoMode='none';memory();};document.querySelector('#download-card').onclick=downloadMemory;document.querySelector('#back-map').onclick=()=>go('map');}
function wrapCanvas(ctx,text,x,y,width,lineHeight,maxLines=3){let line='',lines=0;for(const char of String(text)){if(ctx.measureText(line+char).width>width&&line){ctx.fillText(line,x,y);y+=lineHeight;line='';lines++;if(lines>=maxLines)return y;}line+=char;}if(line){ctx.fillText(line,x,y);y+=lineHeight;}return y;}
async function downloadMemory(){const p=state.profile, canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1500;const c=canvas.getContext('2d');c.fillStyle='#fff8e9';c.fillRect(0,0,1080,1500);c.strokeStyle='#cfaa69';c.lineWidth=4;c.strokeRect(45,45,990,1410);c.textAlign='center';c.fillStyle='#9e7547';c.font='32px serif';c.fillText('✦  MY BIRTHDAY MEMORY  ✦',540,130);if(photoMode==='upload'&&photoUrl){try{const im=new Image();im.src=photoUrl;await im.decode();const ratio=Math.max(540/im.width,330/im.height);c.save();c.beginPath();c.roundRect(270,170,540,330,26);c.clip();c.drawImage(im,270+(540-im.width*ratio)/2,170+(330-im.height*ratio)/2,im.width*ratio,im.height*ratio);c.restore();}catch{}}else{c.fillStyle='#f5e7d2';c.fillRect(270,170,540,330);c.fillStyle='#b39260';c.font='80px serif';c.fillText('✦',540,370);}c.fillStyle='#6a4b37';c.font='bold 54px serif';c.fillText(`${p.name}，生日快樂。`,540,590);c.font='31px sans-serif';c.fillStyle='#876c54';c.fillText(`${p.month} 月 ${p.day} 日 · ${p.age} 歲 · ${p.zodiac.name} ${p.zodiac.symbol}`,540,655);const date=state.completedAt?new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric'}).format(new Date(state.completedAt)):'';c.fillText(date,540,710);c.strokeStyle='#dbc397';c.beginPath();c.moveTo(200,755);c.lineTo(880,755);c.stroke();c.textAlign='left';c.font='32px sans-serif';c.fillStyle='#695543';let y=815;for(const answer of [state.answers.m2,state.answers.a3,state.answers.n3].filter(Boolean).slice(0,3)){y=wrapCanvas(c,answer,180,y,720,47,2)+26;}c.textAlign='center';c.font='34px serif';c.fillStyle='#8b683f';c.fillText('今年，我也為自己許了一個願。',540,1320);c.fillText('原來一個人，也可以好好過生日。',540,1374);canvas.toBlob(blob=>{if(!blob){toast('紀念卡下載失敗，請稍後再試。');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='我的生日紀念卡.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},'image/png');}
function render(){applyTheme(state.profile?.version||selectedVersion);if(route==='setup')setup();else if(route==='morning-film')film('morning');else if(route==='delivery-film')film('delivery');else if(route==='map')map();else if(route==='moment')moment();else if(route==='time-choice')timeChoice();else if(route==='chapter-done')chapterDone();else if(route==='wish')wish();else if(route==='blow')blow();else if(route==='memory')memory();}

function showStartupError(err) {

  if (!target) return;
  target.innerHTML = `<main class="page"><div class="intro"><p class="eyebrow">生日旅程</p><h1 class="title">這次沒有順利開始。</h1><p class="sub">請重新整理頁面再試一次。</p></div><div class="panel"><p class="hint">如果重新整理後仍看到這個畫面，請把畫面截圖給我，我會直接依錯誤訊息修正。</p><p class="error" style="word-break:break-word">${esc(err?.message || err || 'Unknown startup error')}</p><button class="primary full" type="button" onclick="location.reload()">重新整理</button></div></main>`;

try { render(); } catch (err) { showStartupError(err); }
